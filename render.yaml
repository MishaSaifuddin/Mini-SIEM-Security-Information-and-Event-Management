# Render Blueprint - Mini SIEM
services:
  - type: web
    name: mini-siem
    runtime: docker
    plan: free
    repo: https://github.com/MishaSaifuddin/Mini-SIEM-Security-Information-and-Event-Management
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mini-siem-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PORT
        value: 10000

databases:
  - name: mini-siem-db
    databaseName: mini_siem
    plan: free