title: Suspicious PowerShell Encoded Command
id: 6f50b8a0-6e2a-4c4a-b5a7-8b3f4e5a6c7d
status: experimental
description: Detects PowerShell execution with encoded commands, often used for obfuscation
level: high
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        process_name|endswith: '\powershell.exe'
        command_line|contains: '-EncodedCommand'
    filter:
        process_name|contains: 'Microsoft.SharePoint'
    condition: selection and not filter
fields:
    - CommandLine
    - ParentImage
falsepositives:
    - Legitimate administrative scripts
level: high
